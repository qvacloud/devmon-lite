<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>device-monitor lite &middot; __NAME__</title>
<style>
  :root { color-scheme: dark; --accent:#39FF14; --card:#0b0f0b; --line:#173a17; --dim:#7a8f7a; }
  * { box-sizing: border-box; }
  body { margin:0; background:#000; color:#e8ffe8;
         font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
         padding:20px; line-height:1.5; }
  header { max-width:760px; margin:0 auto 18px; }
  h1 { color:var(--accent); font-size:20px; margin:0 0 4px; letter-spacing:.5px; }
  .sub { color:var(--dim); font-size:13px; }
  .wrap { max-width:760px; margin:0 auto; display:grid; gap:16px;
          grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .card h2 { color:var(--accent); font-size:15px; margin:0 0 12px; font-weight:600; }
  .qr { display:block; width:100%; max-width:280px; margin:0 auto; border-radius:12px; background:#fff; padding:10px; }
  code { display:block; background:#05130a; border:1px solid var(--line); border-radius:8px;
         padding:8px 10px; margin-top:10px; font-size:12px; color:#bff5bf; overflow-x:auto; white-space:nowrap; }
  p { margin:0 0 10px; color:#cfe8cf; font-size:13px; }
  .status { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .dot { width:12px; height:12px; border-radius:50%; background:#444; box-shadow:0 0 0 0 rgba(57,255,20,.6); }
  .dot.ok { background:var(--accent); animation:pulse 2s infinite; }
  .dot.bad { background:#ff3b30; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(57,255,20,.5)} 70%{box-shadow:0 0 0 12px rgba(57,255,20,0)} 100%{box-shadow:0 0 0 0 rgba(57,255,20,0)} }
  .metric { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed #12250f; font-size:13px; }
  .metric:last-child { border-bottom:0; }
  .metric b { color:#fff; font-weight:600; }
  .bar { height:6px; border-radius:4px; background:#102410; margin:6px 0 2px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--accent); width:0; transition:width .4s ease; }
  .foot { max-width:760px; margin:22px auto 0; color:var(--dim); font-size:12px; text-align:center; }
  .pill { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:2px 10px;
          font-size:11px; color:var(--accent); }
</style>
</head>
<body data-name="__NAME__" data-token="__TOKEN__">
  <header>
    <h1>__NAME__</h1>
    <div class="sub">device-monitor lite &middot; <span id="os">--</span> <span class="pill" id="ver">v__VERSION__</span></div>
  </header>

  <div class="wrap">
    <div class="card">
      <div class="status">
        <span class="dot" id="dot"></span>
        <b id="state">Conectando...</b>
      </div>
      <div class="metric"><span>CPU</span><b id="cpu">--</b></div>
      <div class="bar"><i id="cpuBar"></i></div>
      <div class="metric"><span>Memoria</span><b id="mem">--</b></div>
      <div class="bar"><i id="memBar"></i></div>
      <div class="metric"><span>Temperatura</span><b id="temp">--</b></div>
      <div class="metric"><span>Disco</span><b id="disk">--</b></div>
      <div class="metric"><span>Encendido</span><b id="uptime">--</b></div>
    </div>

    <div class="card">
      <h2>Anadir a la app</h2>
      <p>Abre <b>device-monitor lite</b> en el movil y escanea este codigo.</p>
      <img class="qr" alt="Codigo QR del equipo" src="__QR_LAN__">
      <code>__LAN_URL__</code>
    </div>

    __PUBLIC_CARD__
  </div>

  <div class="foot">Escanea con la app &middot; o comparte el enlace de arriba</div>

<script>
  const CFG = __CONFIG_JSON__;
  const token = document.body.dataset.token || '';
  const name  = document.body.dataset.name  || '';

  function fmtBytes(n){
    if(!n && n!==0) return '--';
    const u=['B','KB','MB','GB','TB']; let i=0; n=Number(n);
    while(n>=1024 && i<u.length-1){ n/=1024; i++; }
    return n.toFixed(n>=10||i===0?0:1)+' '+u[i];
  }
  function fmtUptime(s){
    s=Math.floor(s||0);
    const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
    if(d>0) return d+'d '+h+'h'; if(h>0) return h+'h '+m+'m'; return m+'m '+Math.floor(s%60)+'s';
  }
  function setBar(id,v){ document.getElementById(id).style.width=Math.max(0,Math.min(100,v||0))+'%'; }

  async function poll(){
    try{
      const r = await fetch('/metrics',{headers:{'X-Auth-Token':token},cache:'no-store'});
      if(!r.ok) throw new Error(r.status);
      const m = await r.json();
      document.getElementById('dot').className='dot ok';
      document.getElementById('state').textContent='En linea';
      document.getElementById('os').textContent=(m.os||'')+'/'+(m.arch||'');
      document.getElementById('cpu').textContent=(m.cpu.usage_percent||0).toFixed(0)+'%  ('+(m.cpu.cores||'?')+' nucleos)';
      setBar('cpuBar', m.cpu.usage_percent);
      document.getElementById('mem').textContent=fmtBytes(m.mem.used)+' / '+fmtBytes(m.mem.total);
      setBar('memBar', m.mem.used_percent);
      const t=(m.temps&&m.temps.length)?Math.max.apply(null,m.temps.map(x=>x.celsius)):null;
      document.getElementById('temp').textContent=t==null?'n/d':t.toFixed(0)+' C';
      const dk=(m.disks&&m.disks.length)?m.disks[0]:null;
      document.getElementById('disk').textContent=dk?((dk.mount||'')+' '+(dk.used_percent||0).toFixed(0)+'%'):'n/d';
      document.getElementById('uptime').textContent=fmtUptime(m.uptime_s);
    }catch(e){
      document.getElementById('dot').className='dot bad';
      document.getElementById('state').textContent='Sin conexion';
    }
  }
  poll(); setInterval(poll, 3000);
</script>
</body>
</html>
